name: Content Center V2 mock preview browser check
on:
  push:
    branches: [main]
    paths:
      - 'review/**'
      - '.github/workflows/v2-review-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-preview:
    name: Browser mock preview / ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test standalone mock V2 for desktop and mobile
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node review/browser-smoke.cjs
